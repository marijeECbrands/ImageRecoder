name: Build EXE

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  build-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        shell: powershell
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name "FashionImageRenamer" `
            --icon "app_icon.ico" `
            --add-data "fotocategorieen.json;." `
            --add-data "matchconfig.json;." `
            app.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: FashionImageRenamer-EXE
          path: dist/FashionImageRenamer.exe
